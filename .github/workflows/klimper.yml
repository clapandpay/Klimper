# SPDX-License-Identifier: AGPL-3.0-or-later
# Klimper CI: checks, desktop builds and the iOS build on every push.
# Upstream's build.yml and npm.yml need Sage's secrets and runners and are disabled in the
# repository's Actions settings (see docs/UPSTREAM.md).
name: Klimper
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier:check
      - run: pnpm lint
      - run: pnpm test:unit
      - name: GTK
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libgtk-3-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets
      - run: cargo test --workspace --all-features
      - run: cargo fmt --all -- --check

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            build: pnpm tauri build --target universal-apple-darwin --no-sign
          - name: Linux
            os: ubuntu-22.04
            build: pnpm tauri build
          - name: Windows
            os: windows-2022
            build: pnpm tauri build
          - name: iOS
            os: macos-26
            ios: true
    steps:
      - uses: actions/checkout@v4
      - name: Rust targets
        if: matrix.name == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: iOS target
        if: matrix.ios
        run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Linux dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libgtk-3-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev
      - name: Windows dependencies
        if: matrix.name == 'Windows'
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cargo install bindgen-cli --locked

      - name: Build
        if: ${{ !matrix.ios }}
        run: ${{ matrix.build }}
        env:
          CI: true

      - name: Setup Xcode
        if: matrix.ios
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      # Until the Apple organisation account exists (TASK-003) the iOS job proves the app
      # compiles: the Rust library for the device and an unsigned Xcode build.
      - name: iOS build (unsigned)
        if: matrix.ios && env.APPLE_DEVELOPMENT_TEAM == ''
        run: |
          pnpm build
          cargo build -p sage-tauri --lib --release --target aarch64-apple-ios
          xcodebuild -project src-tauri/gen/apple/sage-tauri.xcodeproj -scheme sage-tauri_iOS \
            -configuration release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
      - name: iOS archive (signed)
        if: matrix.ios && env.APPLE_DEVELOPMENT_TEAM != ''
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_SECRET_KEY }}
          CI: true
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_SECRET" > ~/private_keys/AuthKey_$APPLE_API_KEY.p8
          export APPLE_API_KEY_PATH=~/private_keys/AuthKey_$APPLE_API_KEY.p8
          pnpm tauri ios build --export-method app-store-connect --build-number ${{ github.run_number }}
