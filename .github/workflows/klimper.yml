#
# Klimper's CI. Upstream's build.yml and npm.yml stay in the tree untouched and are disabled in
# the repository settings (docs/UPSTREAM.md). Steps mirror upstream's build.yml so a change there
# is easy to carry over.
name: Klimper
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - name: Prettier
        run: pnpm prettier:check
      - name: Install GTK
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libgtk-3-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets
      - name: Test
        run: cargo test --workspace --all-features
      - name: Fmt
        run: cargo fmt --all -- --files-with-diff --check

  desktop:
    name: ${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
            build: pnpm tauri build --target universal-apple-darwin
            artifacts: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: Linux (x64)
            build: pnpm tauri build
            artifacts: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - os: windows-2022
            name: Windows (x64)
            build: pnpm tauri build
            artifacts: |
              target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
      - name: Add x86_64-apple-darwin
        if: matrix.name == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Ubuntu dependencies
        if: startsWith(matrix.name, 'Linux')
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libgtk-3-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev
      - name: Windows dependencies
        if: startsWith(matrix.name, 'Windows')
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - name: Bindgen CLI
        run: cargo install bindgen-cli --locked
      # Unsigned until the signing identities exist (TASK-003).
      - name: Build
        run: ${{ matrix.build }}
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        with:
          name: Klimper ${{ matrix.name }}
          path: ${{ matrix.artifacts }}

  ios:
    name: iOS
    if: github.event_name != 'schedule'
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - name: Bindgen CLI
        run: cargo install bindgen-cli --locked
      # Without signing secrets this proves the Rust side compiles for the phone.
      - name: Compile for iOS
        run: cargo check -p sage-tauri --lib --target aarch64-apple-ios
      # With the Apple organisation account (TASK-003) the archive is built as upstream does.
      - name: Save API key to file
        if: env.HAS_SIGNING == 'true'
        run: |
          mkdir -p ~/private_keys
          echo -n '${{ secrets.APPLE_API_SECRET_KEY }}' > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
      - name: Archive
        if: env.HAS_SIGNING == 'true'
        run: pnpm tauri ios build --export-method app-store-connect --build-number ${{ github.run_number }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          VITE_DISABLE_OFFERS: 'true'
          VITE_DISABLE_OPTIONS: 'true'
          VITE_DISABLE_SWAP: 'true'
          CI: true
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: Klimper iOS
          path: src-tauri/gen/apple/build/arm64/*.ipa

  # Daily: report what is new upstream so a security fix is not missed (full job: TASK-025).
  upstream-watch:
    name: Upstream watch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/sync-upstream.sh --check | tee "$GITHUB_STEP_SUMMARY"
