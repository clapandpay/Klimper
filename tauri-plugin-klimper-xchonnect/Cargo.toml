[package]
name = "tauri-plugin-klimper-xchonnect"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Klimper: connect to Chia dApps over Xchonnect (remote signing, CHIP-0002)."
publish = false
links = "tauri-plugin-klimper-xchonnect"

[lints]
workspace = true

[dependencies]
# Xchonnect protocol and wallet-side signing safety.
#
# From crates.io, at an exact version (clapandpay TASK-071 AC #1). The kit requires the
# core at exactly its own version, so the two are always bumped together.
xchonnect-core = { version = "=0.1.0", features = ["idna"] }
xchonnect-wallet-kit = "=0.1.0"

sage = { workspace = true }
sage-api = { workspace = true }
sage-config = { workspace = true }
sage-database = { workspace = true }
sage-keychain = { workspace = true }
sage-wallet = { workspace = true }

tauri = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
reqwest = { workspace = true, features = ["rustls-tls", "charset", "http2"] }
hex = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }

# The same 0.36 line as Sage's chia-wallet-sdk and xchonnect-wallet-kit, so Cargo.lock
# holds one version of each (clapandpay TASK-071 AC #2).
chia-bls = "0.36"
chia-protocol = "0.36"
chia-puzzle-types = "0.36"
# Puzzle construction for coin reads, as Sage builds them for WalletConnect (TASK-082).
chia-wallet-sdk = { workspace = true }
# Partial offers (TASK-165): the driver makes the offer, and the partial-offers plugin reads
# the terms as Klimper's own Make partial offer does and keeps the offer in its list.
chia-partial-offer = { path = "../crates/chia-partial-offer" }
tauri-plugin-klimper-partial-offers = { workspace = true }

# Session keys live in the OS keyring under their own service name, never in the Sage
# signing keychain (clapandpay TASK-073, xchonnect spec 11.3).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# iOS writes the keychain items itself, to mark them this-device-only (TASK-116): keyring's
# iOS backend sets no accessibility, so its items went into backups and to a new phone.
[target.'cfg(target_os = "ios")'.dependencies]
security-framework-sys = "2"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3" }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = [
  "async-secret-service",
  "crypto-rust",
  "tokio",
] }

[dev-dependencies]
tempfile = { workspace = true }
# The take tests (src/execute/take_tests.rs, TASK-137): Sage wallets on a simulated chain.
anyhow = { workspace = true }
indexmap = { workspace = true }
# A real Sage wallet database (schema and migrations) for the chain reads (TASK-082).
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
chia-puzzles = "0.20"
chia-sdk-driver = "0.36"
chia-sdk-test = "0.36"
chia-sdk-types = "0.36"
clvm-traits = "0.36"
clvm-utils = "0.36"
clvmr = "0.16"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
