[package]
name = "tauri-plugin-klimper-card"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Klimper: a payment card from a card issuer (Gnosis Pay first), signed by a key derived from the wallet's own recovery words."
publish = false
links = "tauri-plugin-klimper-card"

[lints]
workspace = true

[dependencies]
sage = { workspace = true }
tauri = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
hex = { workspace = true }
tracing = { workspace = true }
bip39 = { workspace = true }
# The issuer interface (src/issuer.rs) is used as `dyn Issuer`. Already in Cargo.lock.
async-trait = "0.1.89"

# The card signer (src/evm.rs). The same versions Cargo.lock already holds for the rest of
# the workspace, so the plugin adds no new crate to the build.
k256 = { version = "0.13.4", features = ["ecdsa", "arithmetic"] }
sha3 = "0.10.8"
sha2 = "0.10.9"
hmac = "0.12.1"
zeroize = "1.8.2"
# Card details (src/pci.rs): a one-time AES-256 key, wrapped for Gnosis Pay with RSA-OAEP.
# Versions already in Cargo.lock.
aes-gcm = { workspace = true }
rsa = "0.9.9"
base64 = { workspace = true }
rand = { workspace = true }

# The fake Gnosis Pay server (src/fake.rs), for the tests and for running the screens
# locally: `--features fake --example fake-gnosis-pay`. Never in an app build.
axum = { workspace = true, optional = true }

[features]
fake = ["dep:axum", "tokio/net", "tokio/rt-multi-thread", "tokio/macros", "tokio/signal"]

[[example]]
name = "fake-gnosis-pay"
required-features = ["fake"]

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
