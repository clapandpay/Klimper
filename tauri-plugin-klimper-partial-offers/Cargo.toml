[package]
name = "tauri-plugin-klimper-partial-offers"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Klimper: partial offers (CHIP-0052): view, take an amount, make, list and cancel, on Sage's wallet."
publish = false
links = "tauri-plugin-klimper-partial-offers"

[lints]
workspace = true

[dependencies]
chia-partial-offer = { path = "../crates/chia-partial-offer" }
chia-wallet-sdk = { workspace = true }
sage = { workspace = true }
sage-wallet = { workspace = true }
sage-api = { workspace = true }
sage-database = { workspace = true }
tauri = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
hex = { workspace = true }
indexmap = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Two Sage wallets on a simulated chain (src/sage_sim.rs).
anyhow = { workspace = true }
sage-config = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
